[package]
name = "omniagent"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.23"
comrak = { version = "0.59.0", default-features = false }
dunce = "1"
infer = "0.22"
minisign-verify = "=0.3.0"
notify = "8.2"
regex = "1"
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.61", default-features = false }
unicode-normalization = "0.1"
sha2 = "0.10"
similar = "2.7"
subtle = "2.6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "1"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
yaml-edit = { version = "0.3.6", default-features = false }
portable-pty = "0.9"

[dev-dependencies]
minisign = "=0.9.1"
png = "0.18"
tauri = { version = "2", features = ["test"] }
