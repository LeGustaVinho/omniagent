name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    name: Windows fixtures
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --pool=threads --maxWorkers=2 --testTimeout=20000
      - run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=4
      - run: git diff --exit-code -- src/bindings

  desktop-fixtures:
    name: Windows desktop fixtures
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare WebDriver
        shell: pwsh
        run: |
          $drivers = ./tests/desktop/prepare-windows-drivers.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'omniagent-webdriver')
          Write-Output "WebView2 $($drivers.WebView2Version), EdgeDriver $($drivers.EdgeDriverVersion)"
          "OMNIAGENT_TAURI_DRIVER=$($drivers.TauriDriver)" >> $env:GITHUB_ENV
          "OMNIAGENT_EDGE_DRIVER=$($drivers.EdgeDriver)" >> $env:GITHUB_ENV
      - run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --config tests/desktop/tauri.conf.json --ci -- --locked
      - run: pnpm test:desktop
